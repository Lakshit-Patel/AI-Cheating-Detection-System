<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Online Cheating Preventer - Login</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0B0E11;
    font-family:Arial,sans-serif;
}

.card{
    width:340px;
    background:#171C22;
    padding:30px;
    border-radius:12px;
    color:white;
}

input{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:6px;
    box-sizing:border-box;
}

button{
    width:100%;
    margin-top:20px;
    padding:12px;
    background:#2FBF71;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

#error{
    color:#ff7070;
    margin-top:15px;
}
</style>

</head>
<body>

<div class="card">

<h2>Login</h2>

<input
id="email"
placeholder="Email">

<input
id="password"
type="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

<div id="error" role="alert" aria-live="polite"></div>

</div>

<script>
const API_BASE = localStorage.getItem('apiBase') || 'http://127.0.0.1:8000';
function parseJwt(token) {
  try {
    const part = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(escape(atob(part))));
  } catch { return null; }
}
async function login() {
  const errorBox = document.getElementById('error');
  errorBox.textContent = '';
  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  if (!email || !password) { errorBox.textContent = 'Enter your email and password.'; return; }
  const button = document.querySelector('button');
  button.disabled = true; button.textContent = 'Signing in…';
  try {
    const response = await fetch(`${API_BASE}/login`, {
      method: 'POST', headers: {'Content-Type':'application/x-www-form-urlencoded'},
      body: new URLSearchParams({username: email, password})
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || 'Login failed. Check your credentials.');
    const payload = parseJwt(data.access_token);
    if (!payload || !payload.role || !data.refresh_token) throw new Error('Server returned an invalid token response.');
    localStorage.setItem('token', data.access_token);
    localStorage.setItem('refresh_token', data.refresh_token);
    localStorage.setItem('token_exp', String(payload.exp || 0));
    if (payload.role === 'admin') location.href = 'admin.html';
    else if (payload.role === 'student') location.href = 'index.html';
    else throw new Error('Your account has an unsupported role.');
  } catch (err) {
    errorBox.textContent = err.message || 'Could not connect to the server.';
  } finally { button.disabled = false; button.textContent = 'Login'; }
}
document.getElementById('email').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>

</body>
</html>
