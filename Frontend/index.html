<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ProctorAI — Exam Monitoring</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    header {
      height: 64px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 28px;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 8px;

      font-size: 14px;
      color: #4b5563;
    }

    .conn-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #9ca3af;
    }

    .conn-dot.live {
      background: #22c55e;
    }

    .conn-dot.connecting {
      background: #f59e0b;
    }

    .conn-dot.offline {
      background: #ef4444;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 20px;
    }

    .title {
      font-size: 26px;
      font-weight: 700;
    }

    .session {
      font-size: 14px;
      color: #6b7280;
    }

    .monitor-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;

      padding: 20px;

      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
    }

    .camera-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;

      background: #111827;

      border-radius: 10px;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
    }

    #feed {
      width: 100%;
      height: 100%;

      object-fit: contain;

      display: none;
    }

    #placeholder {
      color: #9ca3af;
      text-align: center;
      font-size: 15px;
    }

    .controls {
      margin-top: 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    #startBtn {
      border: none;
      background: #111827;
      color: white;

      padding: 11px 18px;

      border-radius: 8px;

      cursor: pointer;

      font-size: 14px;
      font-weight: 600;
    }

    #startBtn:hover {
      opacity: 0.9;
    }

    .status-box {
      padding: 10px 14px;

      border-radius: 8px;

      background: #f3f4f6;

      font-size: 14px;
      font-weight: 600;
    }

    .status-box.secure {
      background: #dcfce7;
      color: #166534;
    }

    .status-box.flagged {
      background: #fee2e2;
      color: #991b1b;
    }

    .telemetry {
      margin-top: 20px;

      display: grid;

      grid-template-columns: repeat(4, 1fr);

      gap: 12px;
    }

    .telemetry-card {
      background: #f9fafb;

      border: 1px solid #e5e7eb;

      border-radius: 10px;

      padding: 14px;
    }

    .telemetry-label {
      font-size: 12px;
      color: #6b7280;

      margin-bottom: 5px;
    }

    .telemetry-value {
      font-size: 18px;
      font-weight: 700;
    }

    .violation-panel {
      margin-top: 20px;

      padding: 15px;

      border-radius: 10px;

      background: #fff7ed;

      border: 1px solid #fed7aa;

      display: none;
    }

    .violation-title {
      font-weight: 700;

      margin-bottom: 5px;

      color: #9a3412;
    }

    .violation-text {
      color: #7c2d12;

      font-size: 14px;
    }

    @media (max-width: 800px) {
      .telemetry {
        grid-template-columns: repeat(2, 1fr);
      }

      .controls {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="brand">
    ProctorAI
  </div>

  <div class="connection">

    <div
      id="connDot"
      class="conn-dot offline">
    </div>

    <span id="connLabel">
      Offline
    </span>

  </div>

</header>


<main>

  <div class="top">

    <div>

      <div class="title">
        Exam Monitoring
      </div>

      <div class="session">
        Session ID:
        <strong id="sessionIdLabel">—</strong>
      </div>

    </div>

  </div>


  <div class="monitor-card">

    <div class="camera-wrapper">

      <canvas
        id="feed"
        width="640"
        height="480">
      </canvas>

      <div id="placeholder">
        Camera monitoring is not active.
      </div>

    </div>


    <div class="controls">

      <button id="startBtn">
        Start monitoring
      </button>

      <div
        id="statusBox"
        class="status-box">
        Waiting
      </div>

    </div>


    <div class="telemetry">

      <div class="telemetry-card">

        <div class="telemetry-label">
          Face Count
        </div>

        <div
          id="faceCount"
          class="telemetry-value">
          —
        </div>

      </div>


      <div class="telemetry-card">

        <div class="telemetry-label">
          Pitch
        </div>

        <div
          id="pitch"
          class="telemetry-value">
          —
        </div>

      </div>


      <div class="telemetry-card">

        <div class="telemetry-label">
          Yaw
        </div>

        <div
          id="yaw"
          class="telemetry-value">
          —
        </div>

      </div>


      <div class="telemetry-card">

        <div class="telemetry-label">
          Roll
        </div>

        <div
          id="roll"
          class="telemetry-value">
          —
        </div>

      </div>

    </div>


    <div
      id="violationPanel"
      class="violation-panel">

      <div class="violation-title">
        Violation Detected
      </div>

      <div
        id="violationText"
        class="violation-text">
      </div>

    </div>

  </div>

</main>


<script>
const API_BASE = localStorage.getItem('apiBase') || 'http://127.0.0.1:8000';
const WS_BASE = API_BASE.replace(/^http:/, 'ws:').replace(/^https:/, 'wss:');
const startBtn = document.getElementById('startBtn');
const canvas = document.getElementById('feed');
const ctx = canvas.getContext('2d');
const placeholder = document.getElementById('placeholder');
const hiddenVideo = document.createElement('video');
hiddenVideo.autoplay = true; hiddenVideo.playsInline = true; hiddenVideo.muted = true;
const captureCanvas = document.createElement('canvas'); captureCanvas.width = 480; captureCanvas.height = 360;
const captureCtx = captureCanvas.getContext('2d');
let ws = null, sessionId = null, sending = false, mediaStream = null, sendTimer = null, tokenRefreshPromise = null;
let frameBusy = false, authenticatedSocket = false, stopping = false;
function parseJwt(token) {
  try { const p=token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'); return JSON.parse(decodeURIComponent(escape(atob(p)))); } catch { return null; }
}
function clearAuth() { localStorage.removeItem('token'); localStorage.removeItem('refresh_token'); localStorage.removeItem('token_exp'); }
async function refreshToken() {
  if (tokenRefreshPromise) return tokenRefreshPromise;
  tokenRefreshPromise = (async () => {
    const refresh = localStorage.getItem('refresh_token');
    if (!refresh) throw new Error('Your session expired. Please log in again.');
    const r = await fetch(`${API_BASE}/refresh`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:refresh})});
    const data = await r.json().catch(()=>({}));
    if (!r.ok || !data.access_token || !data.refresh_token) { clearAuth(); throw new Error('Your session expired. Please log in again.'); }
    const p = parseJwt(data.access_token);
    localStorage.setItem('token',data.access_token); localStorage.setItem('refresh_token',data.refresh_token); localStorage.setItem('token_exp',String(p?.exp||0));
    return data.access_token;
  })().finally(()=>{ tokenRefreshPromise=null; });
  return tokenRefreshPromise;
}
async function getValidToken() {
  let token = localStorage.getItem('token');
  if (!token) { location.href='login.html'; throw new Error('Please log in.'); }
  const p = parseJwt(token);
  if (!p || !p.exp || p.exp < Math.floor(Date.now()/1000)+30) token = await refreshToken();
  return token;
}
async function apiFetch(path, options={}) {
  let token = await getValidToken();
  const make = t => fetch(`${API_BASE}${path}`, {...options, headers:{...(options.headers||{}),Authorization:`Bearer ${t}`}});
  let response = await make(token);
  if (response.status === 401) { token = await refreshToken(); response = await make(token); }
  if (response.status === 401) { clearAuth(); location.href='login.html'; }
  return response;
}
function setConnectionState(state) {
  document.getElementById('connDot').className='conn-dot '+state;
  document.getElementById('connLabel').textContent=state==='live'?'Live':state==='connecting'?'Connecting…':'Offline';
}
function setStatus(text, flagged=false) { const box=document.getElementById('statusBox'); box.textContent=text; box.className='status-box '+(flagged?'flagged':'secure'); }
async function startMonitoring() {
  startBtn.disabled=true;
  try {
    await getValidToken();
    mediaStream = await navigator.mediaDevices.getUserMedia({video:{width:640,height:480},audio:false});
    hiddenVideo.srcObject=mediaStream; await hiddenVideo.play();
    const response = await apiFetch('/api/v1/sessions',{method:'POST'});
    const sessionData = await response.json().catch(()=>({}));
    if (!response.ok) throw new Error(sessionData.detail || 'Could not create an exam session.');
    sessionId=sessionData.session_id;
    document.getElementById('sessionIdLabel').textContent=String(sessionId);
    placeholder.style.display='none'; canvas.style.display='block'; setConnectionState('connecting');
    connectSocket();
    startBtn.textContent='Stop monitoring'; startBtn.onclick=()=>stopMonitoring();
  } catch(err) {
    const msg = err && err.name==='NotAllowedError' ? 'Camera permission was denied. Allow camera access and try again.'
              : err && err.name==='NotFoundError' ? 'No camera was found on this device.'
              : (err.message || 'Could not start monitoring.');
    setStatus(msg, true);
    if (mediaStream) { mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }
    if (sessionId) { try { await apiFetch(`/api/v1/sessions/${sessionId}`,{method:'DELETE'}); } catch {} sessionId=null; }
    setConnectionState('offline');
  } finally { startBtn.disabled=false; }
}
function connectSocket() {
  const token=localStorage.getItem('token');
  if (!token || !sessionId) { location.href='login.html'; return; }
  ws=new WebSocket(`${WS_BASE}/ws/${sessionId}`); ws.binaryType='arraybuffer'; authenticatedSocket=false;
  ws.onopen=()=>{ setConnectionState('connecting'); ws.send(JSON.stringify({type:'auth',token})); };
  ws.onmessage=(event)=>{
    if (typeof event.data !== 'string') return;
    let data; try { data=JSON.parse(event.data); } catch { return; }
    if (data.type==='ready') { authenticatedSocket=true; sending=true; setConnectionState('live'); setStatus('Calibrating camera…'); sendLoop(); return; }
    if (data.type==='error' || data.error) {
      // Show server-side problems instead of silently leaving a black preview.
      const code = data.code || 'error';
      if (code !== 'frame_too_large') setStatus(`Server error (${code}): ${data.message || data.error || 'see backend log'}`, true);
      return;
    }
    if (data.type==='detection' || data.status) { renderFrame(data); updateTelemetry(data); updateStatus(data); }
  };
  ws.onclose=(event)=>{
    const unexpected = ws !== null;   // stopMonitoring() nulls ws first for intentional closes
    sending=false; authenticatedSocket=false; if (sendTimer) clearTimeout(sendTimer); setConnectionState('offline');
    if (!unexpected) return;
    const why = event.code===1008 ? 'Session authorization failed. Please log in again.'
              : event.code===1011 ? 'The server could not process video (detector error). Check the backend log.'
              : 'Connection to the monitoring server was lost.';
    setStatus(why, true);
    stopMonitoring(why);               // release camera + complete the backend session
  };
  ws.onerror=()=>setConnectionState('offline');
}
function sendLoop() {
  if (!sending || !authenticatedSocket || !ws || ws.readyState!==WebSocket.OPEN) return;
  if (!frameBusy && hiddenVideo.readyState>=2) {
    frameBusy=true;
    captureCtx.drawImage(hiddenVideo,0,0,captureCanvas.width,captureCanvas.height);
    captureCanvas.toBlob(async blob=>{
      try { if (blob && sending && authenticatedSocket && ws?.readyState===WebSocket.OPEN && blob.size<=2*1024*1024) ws.send(await blob.arrayBuffer()); }
      catch(err) { console.warn('Frame send failed',err); }
      finally { frameBusy=false; }
    },'image/jpeg',0.72);
  }
  sendTimer=setTimeout(sendLoop,200);
}
function renderFrame(data) {
  if (!data.frame) return;
  const img=new Image(); img.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);}; img.src='data:image/jpeg;base64,'+data.frame;
}
function updateTelemetry(data) {
  document.getElementById('faceCount').textContent=data.face_count ?? '—';
  for (const key of ['pitch','yaw','roll']) document.getElementById(key).textContent=Number.isFinite(Number(data[key]))?Number(data[key]).toFixed(1):'—';
}
let violationTimeout = null;
function updateStatus(data) {
  let status = String(data.status || 'UNKNOWN');
  if (data.calibrated === false && typeof data.calibration_progress === 'number') {
    status = `CALIBRATING (${Math.round(data.calibration_progress * 100)}%)` + (data.calibration_message ? ` - ${data.calibration_message}` : '');
  }
  const flagged = String(data.status||'').startsWith('FLAGGED') || (Array.isArray(data.violations) && data.violations.length > 0);
  setStatus(status, flagged);
  if (flagged) showViolation(status);
}
function showViolation(status) {
  const panel = document.getElementById('violationPanel');
  document.getElementById('violationText').textContent = status;
  panel.style.display = 'block';
  if (violationTimeout) clearTimeout(violationTimeout);
  violationTimeout = setTimeout(() => { panel.style.display = 'none'; }, 2500);
}
async function stopMonitoring(reason) {
  if (stopping) return; stopping = true;
  sending=false; authenticatedSocket=false; if(sendTimer) clearTimeout(sendTimer);
  if(ws) { const socket=ws; ws=null; socket.close(1000,'Student stopped monitoring'); }
  if(mediaStream) {mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null;}
  if(sessionId) {
    try { const r=await apiFetch(`/api/v1/sessions/${sessionId}`,{method:'DELETE'}); if(!r.ok) console.warn('Session completion failed',r.status); }
    catch(err) { console.warn('Session completion request failed',err); }
  }
  sessionId=null; setConnectionState('offline');
  setStatus(typeof reason==='string' && reason ? reason : 'Monitoring stopped', typeof reason==='string' && !!reason);
  placeholder.style.display='block'; canvas.style.display='none';
  startBtn.textContent='Start monitoring'; startBtn.onclick=startMonitoring; stopping=false;
}
window.addEventListener('beforeunload',()=>{ sending=false; if(ws) ws.close(); if(mediaStream) mediaStream.getTracks().forEach(t=>t.stop()); });
startBtn.onclick=startMonitoring; setConnectionState('offline');
</script>

</body>
</html>
