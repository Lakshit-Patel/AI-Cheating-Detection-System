<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ProctorAI — Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            height: 64px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 28px;
        }

        .brand {
            font-size: 20px;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 9px 14px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .docs-btn {
            background: #111827;
            color: white;
        }

        .logout-btn {
            background: #fee2e2;
            color: #991b1b;
        }

        button:hover {
            opacity: 0.9;
        }

        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .page-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 22px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
        }

        .stat-label {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
        }

        .section {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .session-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .session-item {
            border: 1px solid #e5e7eb;
            border-radius: 9px;
            padding: 14px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            cursor: pointer;
        }

        .session-item:hover {
            background: #f9fafb;
        }

        .session-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .student-name {
            font-weight: 700;
        }

        .session-meta {
            font-size: 12px;
            color: #6b7280;
        }

        .session-status {
            font-size: 12px;
            font-weight: 700;
            padding: 5px 9px;
            border-radius: 6px;
            background: #dcfce7;
            color: #166534;
        }

        .session-status.active {
            background: #fef3c7;
            color: #92400e;
        }

        .violations {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .violation-item {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .violation-type {
            font-weight: 600;
        }

        .violation-time {
            font-size: 12px;
            color: #6b7280;
        }

        .empty {
            color: #6b7280;
            font-size: 14px;
        }

        .error {
            color: #b91c1c;
            font-size: 14px;
        }

        @media (max-width: 800px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .session-item,
            .violation-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="brand">
        ProctorAI — Admin
    </div>

    <div class="header-actions">

        <button
            class="docs-btn"
            onclick="openSwagger()">
            API Schema
        </button>

        <button
            class="logout-btn"
            onclick="logout()">
            Logout
        </button>

    </div>

</header>


<main>

    <div class="page-title">
        Admin Dashboard
    </div>


    <!-- Statistics -->

    <div class="stats">

        <div class="stat-card">

            <div class="stat-label">
                Total Sessions
            </div>

            <div
                id="totalSessions"
                class="stat-value">
                —
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Total Violations
            </div>

            <div
                id="totalViolations"
                class="stat-value">
                —
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-label">
                Phone Detections
            </div>

            <div
                id="phoneDetections"
                class="stat-value">
                —
            </div>

        </div>

    </div>


    <!-- Sessions -->

    <div class="section">

        <div class="section-title">
            Exam Sessions
        </div>

        <div
            id="sessionList"
            class="session-list">

            <div class="empty">
                Loading sessions...
            </div>

        </div>

    </div>


    <!-- Violations -->

    <div class="section">

        <div class="section-title">
            Session Violations
        </div>

        <div
            id="violationList"
            class="violations">

            <div class="empty">
                Select a session to view violations.
            </div>

        </div>

    </div>

</main>


<script>
const API_BASE = localStorage.getItem('apiBase') || 'http://127.0.0.1:8000';
let refreshPromise=null;
function parseJwt(token){try{const p=token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(p))));}catch{return null;}}
function clearAuth(){localStorage.removeItem('token');localStorage.removeItem('refresh_token');localStorage.removeItem('token_exp');}
async function refreshToken(){if(refreshPromise)return refreshPromise;refreshPromise=(async()=>{const refresh=localStorage.getItem('refresh_token');if(!refresh)throw new Error('Login required');const r=await fetch(`${API_BASE}/refresh`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:refresh})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.access_token||!d.refresh_token){clearAuth();throw new Error('Session expired');}const p=parseJwt(d.access_token);localStorage.setItem('token',d.access_token);localStorage.setItem('refresh_token',d.refresh_token);localStorage.setItem('token_exp',String(p?.exp||0));return d.access_token;})().finally(()=>refreshPromise=null);return refreshPromise;}
async function getValidToken(){let t=localStorage.getItem('token');if(!t){location.href='login.html';throw new Error('Login required');}const p=parseJwt(t);if(!p||!p.exp||p.exp<Math.floor(Date.now()/1000)+30)t=await refreshToken();return t;}
async function apiFetch(path){let t=await getValidToken();let r=await fetch(`${API_BASE}${path}`,{headers:{Authorization:`Bearer ${t}`}});if(r.status===401){t=await refreshToken();r=await fetch(`${API_BASE}${path}`,{headers:{Authorization:`Bearer ${t}`}});}if(r.status===401){clearAuth();location.href='login.html';}return r;}
function checkAuthentication(){const token=localStorage.getItem('token');const p=token&&parseJwt(token);if(!p){location.href='login.html';return false;}if(p.role!=='admin'){alert('Admin access required.');location.href='index.html';return false;}return true;}
function openSwagger(){window.open(`${API_BASE}/openapi.json`,'_blank','noopener');}
async function loadStatistics(){try{const r=await apiFetch('/statistics');if(!r.ok)throw new Error(`Statistics request failed (${r.status})`);const d=await r.json();document.getElementById('totalSessions').textContent=d.total_sessions??0;document.getElementById('totalViolations').textContent=d.total_violations??0;document.getElementById('phoneDetections').textContent=d.phone_detections??0;}catch(e){console.error(e);document.getElementById('totalSessions').textContent='—';}}
async function loadSessions(){const c=document.getElementById('sessionList');c.textContent='';try{const r=await apiFetch('/sessions');if(!r.ok)throw new Error(`Sessions request failed (${r.status})`);const sessions=await r.json();if(!sessions.length){c.textContent='No exam sessions found.';return;}for(const s of sessions){const item=document.createElement('div');item.className='session-item';item.tabIndex=0;item.setAttribute('role','button');const info=document.createElement('div');info.className='session-info';const name=document.createElement('div');name.className='student-name';name.textContent=s.student||'Unknown student';const id=document.createElement('div');id.className='session-meta';id.textContent=`Session ID: ${s.session_id ?? s.id}`;const email=document.createElement('div');email.className='session-meta';email.textContent=s.student_email||'';info.append(name,id,email);const status=document.createElement('div');status.className='session-status '+(s.status==='ACTIVE'?'active':'');status.textContent=s.status||'UNKNOWN';item.append(info,status);const open=()=>loadViolations(s.session_id??s.id);item.addEventListener('click',open);item.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});c.appendChild(item);}}catch(e){console.error(e);c.textContent='Could not load sessions. Verify the backend is running and your admin account is authorized.';}}
async function loadViolations(sessionId){const c=document.getElementById('violationList');c.textContent='Loading violations…';try{const r=await apiFetch(`/api/v1/sessions/${encodeURIComponent(sessionId)}/violations`);if(!r.ok)throw new Error(`Violations request failed (${r.status})`);const rows=await r.json();c.textContent='';if(!rows.length){c.textContent='No violations recorded for this session.';return;}for(const v of rows){const item=document.createElement('div');item.className='violation-item';const type=document.createElement('div');type.className='violation-type';type.textContent=v.violation_type||v.type||'Unknown event';const meta=document.createElement('div');meta.className='violation-time';const when=v.timestamp?new Date(v.timestamp).toLocaleString():'Time unavailable';const duration=Number.isFinite(Number(v.duration_seconds))?` · ${Number(v.duration_seconds).toFixed(1)}s`:'';meta.textContent=when+duration;item.append(type,meta);c.appendChild(item);}}catch(e){console.error(e);c.textContent='Could not load violations.';}}
async function logout(){const refresh=localStorage.getItem('refresh_token');try{if(refresh)await fetch(`${API_BASE}/logout`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:refresh})});}catch(e){console.warn('Logout request failed',e);}clearAuth();location.href='login.html';}
if(checkAuthentication()){loadStatistics();loadSessions();}
</script>

</body>
</html>
